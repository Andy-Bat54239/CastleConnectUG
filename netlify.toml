# Netlify reads this file, so the site needs no manual build settings in the dashboard.
[build]
  command = "npm run build"   # checks every lesson, typechecks, then builds
  publish = "dist"

[build.environment]
  # Vite needs Node 20.19+ or 22.12+. Pinning it stops a Netlify default change from breaking builds.
  NODE_VERSION = "22"

# The player counter: two small functions (/api/track and /api/stats). They keep their records in Netlify Blobs, which is
# built in. The only thing to set is STATS_KEY under Site configuration > Environment variables (see the README).
[functions]
  directory = "netlify/functions"
